<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFind - Lost & Found Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎓 CampusFind</h1>
    <p>Smart Campus Lost & Found Management System</p>
    <button id="loginBtn">Login</button>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#report">Report Item</a>
    <a href="#items">Search Items</a>
</nav>

<section class="hero" id="home">
    <h2>Lost Something on Campus?</h2>
    <p>Find your lost belongings or help someone recover theirs.</p>
    <a href="#report" class="btn">Report an Item</a>
</section>

<section class="container">
    <h2>Search Lost & Found Items</h2>

    <input type="text" id="searchInput"
           placeholder="Search item name or location">

    <select id="filterType">
        <option value="all">All Items</option>
        <option value="Lost">Lost Items</option>
        <option value="Found">Found Items</option>
    </select>

    <div id="items" class="items-grid"></div>
</section>

<section class="container" id="report">
    <h2>Report Lost / Found Item</h2>

    <form id="reportForm">
        <input type="text" id="itemName"
               placeholder="Item Name" required>

        <select id="itemType" required>
            <option value="">Select Item Type</option>
            <option value="Lost">Lost</option>
            <option value="Found">Found</option>
        </select>

        <input type="text" id="location"
               placeholder="Location" required>

        <input type="text" id="contact"
               placeholder="Contact Information" required>

        <textarea id="description"
                  placeholder="Item Description" required></textarea>

        <input type="file" id="itemImage" accept="image/*">

        <button type="submit">Submit Report</button>
    </form>
</section>

<footer>
    <p>© 2026 CampusFind | Smart Campus Project</p>
</footer>

<script src="script.js"></script>
</body>
</html>
